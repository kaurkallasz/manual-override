<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photon Board</title><link rel="stylesheet" href="/theme.css"><style>
body{margin:0;padding:18px;background:#0d0f0d;color:#c8d4c0;font:13px ui-monospace,monospace}main{display:grid;grid-template-columns:1fr 1fr;gap:16px}pre,textarea{border:1px solid #2a3128;background:#121712;color:#c8d4c0;padding:12px;min-height:360px;white-space:pre-wrap}textarea{width:100%;box-sizing:border-box;resize:vertical}button{padding:9px 14px;background:#b6ff3a;border:0;font-weight:700;cursor:pointer}.bad{color:#ff795d}h1{font-size:16px;letter-spacing:.15em}@media(max-width:800px){main{grid-template-columns:1fr}}
</style></head><body><h1>PHOTON BOARD</h1><p>Corrected evidence in, normalized board observation out. Simulation is explicit and never impersonates the camera.</p><main><section><h2>Input</h2><label><input type="checkbox" id="enabled"> Use simulated tags</label><textarea id="tags">[{"id":100,"nx":0.28,"ny":0.13},{"id":101,"nx":0.54,"ny":0.13},{"id":102,"nx":0.19,"ny":0.67},{"id":103,"nx":0.68,"ny":0.81}]</textarea><button id="apply">Apply input</button></section><section><h2>Output</h2><pre id="out">Loading…</pre></section></main><script>
const out=document.querySelector('#out');function show(v){out.textContent=JSON.stringify(v,null,2);out.className=v.status==='ready'?'':'bad'}document.querySelector('#apply').onclick=async()=>{let tags;try{tags=JSON.parse(document.querySelector('#tags').value)}catch(e){out.textContent=e.message;return}const r=await fetch('api/simulation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:document.querySelector('#enabled').checked,tags})}),v=await r.json();show(v.output||v)};fetch('api/board').then(r=>r.json()).then(show);new EventSource('api/events').onmessage=e=>show(JSON.parse(e.data));
</script></body></html>
