<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photon Level</title><link rel="stylesheet" href="/theme.css"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#0d0f0d;color:#c8d4c0;font:13px ui-monospace,monospace}header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:14px}h1{font-size:16px;letter-spacing:.15em;margin:0 0 6px}.muted{color:#7f8c78;margin:0}.status{color:#b6ff3a;text-align:right}main{display:grid;grid-template-columns:minmax(500px,1fr) minmax(310px,.55fr);gap:16px}canvas{width:100%;aspect-ratio:53/30;border:1px solid #2a3128;background:#111711;cursor:crosshair}.panel{border:1px solid #2a3128;background:#121712;padding:12px;max-height:calc(100vh - 105px);overflow:auto}.socket{display:grid;grid-template-columns:1fr 70px 70px 64px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid #222b20}.socket span{white-space:nowrap}.socket input{width:100%;padding:5px;background:#0d110d;color:#d9e3d4;border:1px solid #34402f}button{margin-top:12px;padding:9px 14px;background:#b6ff3a;color:#10130e;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.io{margin-top:14px;padding-top:10px;border-top:1px solid #2a3128;line-height:1.65}@media(max-width:900px){main{grid-template-columns:1fr}.panel{max-height:none}}
</style></head><body>
<header><div><h1>PHOTON LEVEL</h1><p class="muted">Drag sockets or enter exact coordinates. Photon Level alone validates and publishes the authored layout.</p></div><div class="status" id="status">Loading…</div></header>
<main><canvas id="map" width="1060" height="600" aria-label="Editable Photon playfield"></canvas><section class="panel"><div id="sockets"></div><button id="save" disabled>Validate &amp; publish all 16 sockets</button><div class="io"><b>Input</b>: complete socket layout + expected revision<br><b>Output</b>: <code>photon.level</code> v2 and <code>photon.level.runtime</code> v1<br><b>Owned here</b>: TMJ map, routes, socket geometry, waves, Tiled assets</div></section></main>
<script>
const canvas=document.querySelector('#map'),ctx=canvas.getContext('2d'),list=document.querySelector('#sockets'),statusEl=document.querySelector('#status'),save=document.querySelector('#save');
let output=null,level=null,revision=0,drag=null,dirty=false;
function scales(){return [canvas.width/level.width,canvas.height/level.height]}
function draw(){if(!level)return;const [sx,sy]=scales();ctx.clearRect(0,0,canvas.width,canvas.height);ctx.lineCap='round';for(const points of Object.values(level.paths)){ctx.strokeStyle='#34422f';ctx.lineWidth=18;ctx.beginPath();points.forEach((p,i)=>(i?ctx.lineTo(p.x*sx,p.y*sy):ctx.moveTo(p.x*sx,p.y*sy)));ctx.stroke()}for(const socket of level.sockets){const selected=drag&&drag.id===socket.id;ctx.fillStyle=socket.owner==='purple'?'#392849':'#173f31';ctx.strokeStyle=selected?'#fff':'#b6ff3a';ctx.lineWidth=selected?4:2;ctx.beginPath();ctx.arc(socket.x*sx,socket.y*sy,Math.max(7,socket.size*.18*Math.min(sx,sy)),0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#e6efdf';ctx.fillText(String(socket.aruco_id),socket.x*sx+8,socket.y*sy-8)}}
function renderRows(){list.innerHTML=level.sockets.map((s,i)=>`<label class="socket"><span>${s.id} · A${s.aruco_id}</span><input data-i="${i}" data-key="x" type="number" step="1" value="${Math.round(s.x)}" aria-label="${s.id} x"><input data-i="${i}" data-key="y" type="number" step="1" value="${Math.round(s.y)}" aria-label="${s.id} y"><input data-i="${i}" data-key="size" type="number" min="96" max="208" step="1" value="${Math.round(s.size)}" aria-label="${s.id} size"></label>`).join('');list.querySelectorAll('input').forEach(input=>input.onchange=()=>{const socket=level.sockets[+input.dataset.i];socket[input.dataset.key]=+input.value;dirty=true;draw();setStatus('Unsaved changes')})}
function setStatus(text,error=false){statusEl.textContent=text;statusEl.style.color=error?'#ff837a':'#b6ff3a'}
async function load(){const response=await fetch('api/level'),next=await response.json();if(!response.ok||next.status!=='ready')throw new Error(next.error||'Photon Level unavailable');output=next;level=JSON.parse(JSON.stringify(next.level));revision=next.revision;dirty=false;renderRows();draw();save.disabled=false;setStatus(`${next.contract} v${next.version} · revision ${revision}`)}
function pointer(event){const rect=canvas.getBoundingClientRect(),[sx,sy]=scales();return [(event.clientX-rect.left)*canvas.width/rect.width/sx,(event.clientY-rect.top)*canvas.height/rect.height/sy]}
canvas.onpointerdown=event=>{if(!level)return;const [x,y]=pointer(event);drag=level.sockets.reduce((best,s)=>{const d=Math.hypot(s.x-x,s.y-y);return d<(best?.d??45)?{id:s.id,d}:best},null);if(drag)canvas.setPointerCapture(event.pointerId);draw()};
canvas.onpointermove=event=>{if(!drag)return;const [x,y]=pointer(event),socket=level.sockets.find(s=>s.id===drag.id);socket.x=Math.round(Math.max(0,Math.min(level.width,x)));socket.y=Math.round(Math.max(0,Math.min(level.height,y)));dirty=true;renderRows();draw();setStatus('Unsaved changes')};
canvas.onpointerup=()=>{drag=null;draw()};canvas.onpointercancel=canvas.onpointerup;
save.onclick=async()=>{save.disabled=true;setStatus('Validating…');try{const response=await fetch('api/layout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expected_revision:revision,sockets:level.sockets.map(({socket_id,x,y,size})=>({socket_id,x:Math.round(x),y:Math.round(y),size:Math.round(size)}))})}),body=await response.json();if(!response.ok||!body.ok)throw new Error(body.error||'Layout rejected');await load()}catch(error){setStatus(error.message,true);save.disabled=false}};
load().catch(error=>setStatus(error.message,true));
</script></body></html>
