<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photon Level · Artwork</title>
<link rel="stylesheet" href="/theme.css">
<style>
:root{--bg:#0d0f0d;--panel:#121712;--line:#2a3a2a;--ink:#c8d4c0;--hot:#b6ff3a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:13px ui-monospace,monospace}body{padding:24px}h1{margin:0;font-size:17px;letter-spacing:.15em;color:var(--hot)}h2{margin:24px 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.12em}.summary{color:#91a08d}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.card{min-width:0;padding:10px;border:1px solid var(--line);background:var(--panel)}.preview{display:grid;place-items:center;height:116px;margin-bottom:8px;background:#080b08;overflow:hidden}.preview img{max-width:100%;max-height:100%;image-rendering:pixelated}.card code{display:block;overflow-wrap:anywhere;color:#dbe7d6;font-size:10px}.error{color:#ff795d}
</style>
</head>
<body>
<h1>PHOTON LEVEL · ARTWORK</h1>
<p class="summary"><a href="./">Back to Level editor</a> · Shared authored content: map components, sprites, effects, and ArUco codes. Game forwards these asset references to its presentation.</p>
<p id="status">Loading manifest…</p>
<main id="catalog"></main>
<script>
const status=document.getElementById('status'),catalog=document.getElementById('catalog');
function card(key,path){const item=document.createElement('article');item.className='card';const preview=document.createElement('div');preview.className='preview';const image=new Image();image.src=`assets/${path}`;image.alt=key;preview.append(image);const label=document.createElement('code');label.textContent=key;item.append(preview,label);return item}
async function boot(){try{const response=await fetch('api/assets'),manifest=await response.json();if(!response.ok)throw Error(manifest.error||`HTTP ${response.status}`);const groups=new Map;for(const [key,path] of Object.entries(manifest.assets||{})){const group=key.split('/')[0];if(!groups.has(group))groups.set(group,[]);groups.get(group).push([key,path])}status.textContent=`${Object.keys(manifest.assets||{}).length} assets · ${manifest.contract} v${manifest.version}${manifest.error?' · '+manifest.error:''}`;status.className=manifest.status==='ready'?'':'error';for(const [name,assets] of groups){const heading=document.createElement('h2');heading.textContent=`${name} · ${assets.length}`;const grid=document.createElement('section');grid.className='grid';for(const [key,path] of assets)grid.append(card(key,path));catalog.append(heading,grid)}}catch(error){status.className='error';status.textContent=`Manifest unavailable: ${error.message}`}}
boot();
</script>
</body>
</html>
