<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photon Game</title><link rel="stylesheet" href="/theme.css"><style>body{margin:0;padding:18px;background:#0d0f0d;color:#c8d4c0;font:13px ui-monospace,monospace}button{padding:8px 12px;margin:0 6px 8px 0;border:1px solid #b6ff3a;background:#182116;color:#b6ff3a;cursor:pointer}pre{padding:14px;border:1px solid #2a3128;background:#121712;white-space:pre-wrap;max-height:70vh;overflow:auto}h1{font-size:16px;letter-spacing:.15em}</style></head><body><h1>PHOTON GAME</h1><p>Server-authoritative state. This diagnostic tab intentionally contains no game renderer.</p><button data-action="start">Start</button><button data-action="pause">Pause</button><button data-action="resume">Resume</button><button data-action="reset">Reset</button><pre id="out">Waiting for state…</pre><script>
const out=document.querySelector('#out');function show(v){out.textContent=JSON.stringify(v,null,2)}fetch('api/state').then(r=>r.json()).then(show);new EventSource('api/events').onmessage=e=>show(JSON.parse(e.data));document.querySelectorAll('button').forEach(b=>b.onclick=async()=>{const r=await fetch('api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:b.dataset.action})});show(await r.json())});
</script></body></html>
