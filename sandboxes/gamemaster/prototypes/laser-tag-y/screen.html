<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laser Tag Y · Game Screen</title>
<link rel="stylesheet" href="/theme.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#f4f8ff;font-family:system-ui,sans-serif}.viewport{position:fixed;inset:0;display:grid;place-items:center;background:#000}.stage{position:relative;width:min(100vw,176.6667vh);height:min(100vh,56.6038vw);overflow:hidden;background:radial-gradient(circle at 50% 50%,#111d24,#020407 66%)}.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.status{position:absolute;top:14px;left:50%;z-index:3;max-width:min(90vw,680px);transform:translateX(-50%);padding:8px 13px;border:1px solid #ffffff35;border-radius:8px;background:#05080de8;box-shadow:0 8px 28px #000a;text-align:center;font-size:13px;font-weight:800;transition:opacity .2s}.status.ready{opacity:0}.status.error{border-color:#ff536799;color:#ffb1bb}
</style>
</head>
<body>
<main class="viewport" aria-label="Laser Tag Y external Photon Game screen"><section class="stage"><canvas id="mapCanvas" width="1696" height="960" aria-label="Photon Game playfield"></canvas><canvas id="gameCanvas" width="1696" height="960" aria-label="Live Photon Game presentation"></canvas><div id="status" class="status" role="status" aria-live="polite">Loading Photon Game output…</div></section></main>
<script src="tower-defence-view.js?v=5"></script>
<script>
const ROOT=location.pathname.split('/p/')[0],SELF=`${ROOT}/p/laser-tag-y`,status=document.getElementById('status');let view=null,events=null,artError='';
async function json(url){const response=await fetch(url),text=await response.text();let data={};try{data=text?JSON.parse(text):{}}catch(_){}if(!response.ok)throw Error(data.error||text||`HTTP ${response.status}`);return data}
function applyState(state){if(!view)return;view.applyState(state);if(state.status!=='ready'){status.textContent=`Photon Game unavailable: ${state.error||'not ready'}`;status.className='status error';return}status.textContent=`${state.paused?'Paused':state.phase||'Setup'} · Wave ${state.wave||0} / ${state.wave_count||0} · ${state.active_enemies||0} orcs`;const warning=artError||(state.presentation?.status!=='ready'?(state.presentation?.error||'Artwork unavailable'):'');if(warning)status.textContent+=` · Artwork fallback: ${warning}`;status.className=warning?'status error':'status ready';document.title=`Laser Tag Y · ${state.level?.name||'Photon Game'}`}
async function boot(){view=TowerDefenceView.create({sandboxRoot:ROOT,onAssetError:message=>{artError=message;},mapCanvas:document.getElementById('mapCanvas'),gameCanvas:document.getElementById('gameCanvas')});try{applyState(await json(`${SELF}/api/state`))}catch(error){status.textContent=`Game feed unavailable: ${error.message}`;status.className='status error'}events=new EventSource(`${SELF}/api/events`);events.onopen=()=>view.setFeedConnected(true);events.onmessage=event=>{try{view.setFeedConnected(true);applyState(JSON.parse(event.data))}catch(_){}};events.onerror=()=>{view.setFeedConnected(false);status.textContent='Photon Game stream reconnecting…';status.className='status'}}
window.addEventListener('beforeunload',()=>{events?.close();view?.destroy()});boot();
</script>
</body>
</html>
