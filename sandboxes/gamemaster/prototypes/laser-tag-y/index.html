<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laser Tag Y</title><link rel="stylesheet" href="/theme.css"><style>
:root{--bg:#081014;--panel:#101b20;--line:#25404a;--ink:#d7eef1;--hot:#b6ff3a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:13px ui-monospace,monospace}body{padding:14px}.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.top h1{font-size:16px;letter-spacing:.18em;margin:0 auto 0 0;color:var(--hot)}button,select,input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:8px}button{cursor:pointer}button.primary{background:var(--hot);color:#10160b;border-color:var(--hot);font-weight:700}.layout{display:grid;grid-template-columns:minmax(520px,1fr) 280px;gap:12px}canvas{width:100%;aspect-ratio:16/9;background:#0c1817;border:1px solid var(--line);display:block}.panel{background:var(--panel);border:1px solid var(--line);padding:12px}.metric{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0}.error{color:#ff795d;white-space:pre-wrap}.screen .top button,.screen .top select,.screen .top label,.screen .panel{display:none}.screen{padding:0;overflow:hidden}.screen .layout{display:block}.screen canvas{height:100vh;width:100vw;object-fit:contain;border:0}@media(max-width:850px){.layout{grid-template-columns:1fr}}
</style></head><body><header class="top"><h1>LASER TAG Y</h1><button class="primary" data-action="start">Start</button><button data-action="pause">Pause</button><button data-action="resume">Resume</button><button data-action="reset">Reset</button><label><input id="virtual" type="checkbox" checked> Virtual</label><select id="tag"><option>100</option><option>101</option><option>102</option><option>103</option></select><select id="socket"></select><button id="place">Place</button></header><main class="layout"><canvas id="game" width="960" height="540"></canvas><aside class="panel"><div class="metric"><span>Phase</span><b id="phase">—</b></div><div class="metric"><span>Core</span><b id="core">—</b></div><div class="metric"><span>Kills</span><b id="score">—</b></div><div class="metric"><span>Enemies</span><b id="enemies">—</b></div><div class="metric"><span>Level input</span><b id="levelIn">—</b></div><div class="metric"><span>Board input</span><b id="boardIn">—</b></div><p id="message"></p><p class="error" id="error"></p></aside></main><script>
const screenMode=location.pathname.endsWith('/screen');if(screenMode)document.body.classList.add('screen');const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),images={};let state=null;
async function loadArt(){try{const r=await fetch('api/art'),m=await r.json();if(!r.ok)return;for(const [name,path] of Object.entries(m.sprites)){const img=new Image();img.src=m.base+path;images[name]=img}}catch(_){}}
function fallback(kind,x,y,size,color){ctx.fillStyle=color;ctx.beginPath();if(kind==='enemy')ctx.arc(x,y,size/2,0,Math.PI*2);else ctx.rect(x-size/2,y-size/2,size,size);ctx.fill()}
function sprite(kind,x,y,size,color){const img=images[kind];if(img&&img.complete)ctx.drawImage(img,x-size/2,y-size/2,size,size);else fallback(kind,x,y,size,color)}
function render(s){state=s;const error=document.querySelector('#error');if(s.status!=='ready'||!s.level){error.textContent=s.error||'Photon Game is waiting for Photon Level';ctx.clearRect(0,0,960,540);return}error.textContent='';const level=s.level,sx=960/level.width,sy=540/level.height;ctx.clearRect(0,0,960,540);ctx.fillStyle='#0c1817';ctx.fillRect(0,0,960,540);ctx.strokeStyle='#38564c';ctx.lineWidth=30;ctx.lineCap='round';for(const path of Object.values(level.paths||{main:level.path})){ctx.beginPath();path.forEach((p,i)=>(i?ctx.lineTo(p[0]*sx,p[1]*sy):ctx.moveTo(p[0]*sx,p[1]*sy)));ctx.stroke()}for(const socket of level.sockets){ctx.strokeStyle='#5c8475';ctx.lineWidth=2;ctx.beginPath();ctx.arc(socket.x*sx,socket.y*sy,socket.radius*Math.min(sx,sy),0,Math.PI*2);ctx.stroke()}const path=level.path,end=path[path.length-1];if(end)sprite('core',end[0]*sx,end[1]*sy,72,'#b6ff3a');for(const tower of s.towers)sprite('tower',tower.x*sx,tower.y*sy,58,tower.team==='green'?'#36e07c':'#b86bff');for(const enemy of s.enemies){sprite('enemy',enemy.x*sx,enemy.y*sy,42,'#83b657');ctx.fillStyle='#251b18';ctx.fillRect(enemy.x*sx-20,enemy.y*sy-27,40,4);ctx.fillStyle='#ff795d';const hp=enemy.hp??enemy.health,max=enemy.max_hp??enemy.max_health??1;ctx.fillRect(enemy.x*sx-20,enemy.y*sy-27,40*Math.max(0,hp/max),4)}document.querySelector('#phase').textContent=s.paused?'paused':s.phase;document.querySelector('#core').textContent=Math.round(100*s.core_hp/s.core_max_hp)+'%';document.querySelector('#score').textContent=s.kills;document.querySelector('#enemies').textContent=s.enemies.length;document.querySelector('#levelIn').textContent=s.inputs.level.status;document.querySelector('#boardIn').textContent=s.inputs.board.status;document.querySelector('#message').textContent=s.phase==='running'?'Defend the learning core':'';const choices=document.querySelector('#socket');if(!choices.options.length)for(const item of level.sockets)choices.add(new Option(item.id,item.id))}
async function command(data){const r=await fetch('api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),out=await r.json();if(out.output)render(out.output);else document.querySelector('#error').textContent=out.error||'Command failed'}
document.querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>command({action:button.dataset.action,...(button.dataset.action==='start'?{virtual_play:document.querySelector('#virtual').checked}:{})}));document.querySelector('#place').onclick=()=>command({action:'place',atom_tag_id:+document.querySelector('#tag').value,socket_id:document.querySelector('#socket').value});fetch('api/state').then(async r=>render(await r.json())).catch(e=>render({status:'unavailable',error:e.message}));const events=new EventSource('api/events');events.onmessage=e=>render(JSON.parse(e.data));events.onerror=()=>document.querySelector('#error').textContent='Live game output disconnected; retrying.';loadArt();
</script></body></html>
