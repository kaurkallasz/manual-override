<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<title>__LABEL__ — Login</title>
<style>
  :root {
    --bg:#0d0f0d; --line:#2a3128; --ink:#c8d4c0; --dim:#5e6b58;
    --hot:__ACCENT__; --pad:#1b1f1a; --grid:#1a1e18; --warn:#ff5b3a;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body { background: var(--bg); color: var(--ink);
    font-family: "DM Mono",ui-monospace,"Cascadia Mono",Menlo,monospace;
    display: flex; align-items: center; justify-content: center; height: 100vh;
    background-image:
      linear-gradient(var(--grid) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size: 22px 22px; }
  form { background: rgba(13,15,13,.92); border: 1px solid var(--line);
    border-radius: 10px; padding: 28px 30px; width: 320px;
    display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 14px; margin: 0; font-weight: 700; letter-spacing: .28em;
    text-transform: uppercase; color: var(--hot); }
  .sub { color: var(--dim); font-size: 11px; letter-spacing: .15em;
    text-transform: uppercase; }
  input[type=password] { background: var(--pad); border: 1px solid var(--line);
    color: var(--ink); padding: 9px 11px; border-radius: 6px; font: inherit;
    font-size: 13px; letter-spacing: .08em; }
  input[type=password]:focus { outline: none; border-color: var(--hot); }
  button { background: var(--hot); border: 1px solid var(--hot); color: #0d0f0d;
    padding: 9px 12px; border-radius: 6px; font: inherit; font-size: 12px;
    letter-spacing: .12em; text-transform: uppercase; font-weight: 700;
    cursor: pointer; }
  .err { color: var(--warn); font-size: 12px; letter-spacing: .06em;
    min-height: 14px; }
  a.home { color: var(--dim); font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; text-decoration: none; }
  a.home:hover { color: var(--hot); }
</style>
</head>
<body>
<form method="post">
  <h1>__LABEL__</h1>
  <span class="sub">enter this sandbox's password</span>
  <input type="password" name="password" placeholder="password" autofocus
         autocomplete="current-password" />
  <div class="err" role="status" aria-live="polite">__ERROR__</div>
  <button type="submit">Enter</button>
  <a class="home" href="/">← all sandboxes</a>
</form>
<script>
// Invitations arrive in the fragment, which is removed before making requests.
(async () => {
  const fragment = new URLSearchParams(location.hash.slice(1));
  if (!fragment.has('join')) return;
  const token = fragment.get('join');
  history.replaceState(null, '', location.pathname + location.search);
  const match = location.pathname.match(/^\/s\/(green|purple)\/login$/);
  if (!match) return;
  const next = `/s/${match[1]}/p/mobile-ltz/`;
  const form = document.querySelector('form');
  const status = document.querySelector('[role="status"]');
  const fields = [...form.querySelectorAll('input,button')];
  // Manual login remains useful if a link expires or JavaScript networking fails.
  form.action = location.pathname + '?next=' + encodeURIComponent(next);
  status.textContent = `Signing in to ${match[1] === 'green' ? 'Green' : 'Purple'}…`;
  fields.forEach(field => { field.disabled = true; });
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 12000);
  try {
    const response = await fetch(location.pathname + '/join', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({token}), signal: controller.signal,
    });
    const data = await response.json();
    if (!response.ok || !data.ok) throw Error(data.error || 'Could not sign in. Scan again or enter your team password.');
    if (data.next !== next) throw Error('Unexpected join destination. Enter your team password.');
    location.replace(next);
  } catch (error) {
    status.textContent = controller.signal.aborted
      ? 'Sign-in timed out. Scan again or enter your team password.'
      : error.message;
    fields.forEach(field => { field.disabled = false; });
    form.querySelector('input').focus();
  } finally { clearTimeout(timeout); }
})();
</script>
</body>
</html>
